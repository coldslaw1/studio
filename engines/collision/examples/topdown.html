<!doctype html>
<meta charset="utf-8">
<title>collision example: top-down walk, bullets, a trigger</title>
<style>body{margin:0;background:#12141c;color:#aab;font:13px Consolas,monospace;display:grid;place-items:center;height:100vh}canvas{background:#1d2230}</style>
<div><canvas id="game" width="640" height="360"></canvas><div>WASD or arrows: walk. Space: shoot right. The green zone is a trigger.</div></div>
<script type="module">
import { createCollisionWorld, box, regularPolygon, vertsOf, isCircle } from '../src/index.js';

const ctx = document.getElementById('game').getContext('2d');
const world = createCollisionWorld();
const WALL = 1, BULLET = 2, PLAYER = 4; // bullets only look for walls, so they never hit the shooter
world.add({ x: 0, y: 0, w: 640, h: 10 }); world.add({ x: 0, y: 350, w: 640, h: 10 });
world.add({ x: 0, y: 0, w: 10, h: 360 }); world.add({ x: 630, y: 0, w: 10, h: 360 });
world.add({ ...box(220, 140, 140, 50, 25), color: '#7a6a55' });       // a turned house
world.add({ ...regularPolygon(430, 230, 40, 6, 10), color: '#5d6a7a' });
world.add({ x: 360, y: 80, r: 22, color: '#3f6b4a' });
world.add({ x: 500, y: 100, w: 3, h: 120, color: '#aaa' });           // a very thin wall
const zone = world.add({ x: 540, y: 250, w: 70, h: 80, trigger: true, color: '#2d5' });
const player = world.add({ x: 60, y: 180, r: 9, layer: PLAYER, color: '#e8c15a' });
const bullets = [];
let inZone = false;
world.on('enter', (t, o) => { if (t === zone && o === player) inZone = true; });
world.on('exit', (t, o) => { if (t === zone && o === player) inZone = false; });

const keys = new Set();
addEventListener('keydown', (e) => { keys.add(e.key.toLowerCase()); if (e.key === ' ') bullets.push(world.add({ x: player.x, y: player.y, r: 2, layer: BULLET, mask: WALL, color: '#fff' })); });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
const axis = (neg, pos) => (pos.some((k) => keys.has(k)) ? 1 : 0) - (neg.some((k) => keys.has(k)) ? 1 : 0);

function update(dt) {
  world.move(player, axis(['a', 'arrowleft'], ['d', 'arrowright']) * 150 * dt, axis(['w', 'arrowup'], ['s', 'arrowdown']) * 150 * dt);
  for (const b of bullets.slice()) {
    if (world.move(b, 6000 * dt, 0, { slide: false }).hits.length) { world.remove(b); bullets.splice(bullets.indexOf(b), 1); }
  }
}

function draw() {
  ctx.clearRect(0, 0, 640, 360);
  for (const b of world.bodies) {
    ctx.fillStyle = b.color || '#39405a';
    ctx.globalAlpha = b.trigger ? (inZone ? 0.7 : 0.3) : 1;
    ctx.beginPath();
    if (isCircle(b)) ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    else vertsOf(b).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
let extra = 0;
function frame(now) {
  extra += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (extra >= 1 / 60) { update(1 / 60); extra -= 1 / 60; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.game = { get state() { return { x: player.x, y: player.y, inZone, bullets: bullets.length }; } };
</script>
