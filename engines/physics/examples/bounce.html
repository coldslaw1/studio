<!doctype html>
<meta charset="utf-8">
<title>physics example: bouncing balls</title>
<style>body{margin:0;background:#12141c;display:grid;place-items:center;height:100vh}canvas{background:#1d2230}</style>
<canvas id="game" width="640" height="360"></canvas>
<script type="module">
import { createWorld } from '../src/index.js';

const ctx = document.getElementById('game').getContext('2d');
const world = createWorld({ gravityY: 900 });

// Walls and floor never move: type 'static'.
world.add({ x: 0, y: 340, w: 640, h: 20, type: 'static' });
world.add({ x: -20, y: 0, w: 20, h: 360, type: 'static' });
world.add({ x: 640, y: 0, w: 20, h: 360, type: 'static' });
world.add({ x: 220, y: 220, w: 200, h: 16, type: 'static' });

for (let i = 0; i < 12; i++) {
  world.add({ x: 60 + i * 45, y: 40 + (i % 3) * 30, r: 10 + (i % 3) * 4, vx: (i % 2 ? 1 : -1) * 120, bounce: 0.7, color: `hsl(${i * 30} 80% 60%)` });
}
const crate = world.add({ x: 300, y: 100, w: 30, h: 30, color: '#c9a36b' });

let last = performance.now();
let extra = 0;
function frame(now) {
  extra += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (extra >= 1 / 60) { world.step(1 / 60); extra -= 1 / 60; }   // fixed steps
  ctx.clearRect(0, 0, 640, 360);
  for (const b of world.bodies) {
    ctx.fillStyle = b.color || '#5b6480';
    if (b.r) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.game = { get state() { return { bodies: world.bodies.length, crateY: crate.y }; } };
</script>
